track: fintech
stage: f0
concepts:
  - { id: "money-functions", name: { vi: "Tiền và chức năng của tiền", en: "Money and its functions" }, short: "Tiền là phương tiện trao đổi, đơn vị đo giá trị và phương tiện lưu giữ giá trị.", difficulty: 1, tags: [tiền, money] }
  - { id: "interest-rate", name: { vi: "Lãi suất", en: "Interest rate" }, short: "Giá của việc sử dụng tiền theo thời gian, biểu diễn theo tỷ lệ trên một kỳ.", prerequisites: [money-functions], difficulty: 1, tags: [lãi suất, interest] }
  - { id: "compound-interest", name: { vi: "Lãi kép", en: "Compound interest" }, short: "Lãi được nhập vào gốc để tiếp tục sinh lãi; tần suất ghép lãi ảnh hưởng tới lãi suất hiệu dụng.", prerequisites: [interest-rate], difficulty: 2, tags: [lãi kép, EAR, APR] }
  - { id: "time-value-of-money", name: { vi: "Giá trị thời gian của tiền", en: "Time value of money" }, short: "Một đồng hôm nay khác một đồng tương lai; chiết khấu và tích luỹ quy dòng tiền về cùng thời điểm.", prerequisites: [compound-interest], difficulty: 2, tags: [PV, FV, annuity] }
  - { id: "npv-irr", name: { vi: "NPV và IRR", en: "NPV and IRR" }, short: "NPV là tổng giá trị hiện tại của các dòng tiền; IRR là lãi suất làm NPV bằng 0.", prerequisites: [time-value-of-money], difficulty: 3, tags: [NPV, IRR, chiết khấu] }
  - { id: "inflation", name: { vi: "Lạm phát", en: "Inflation" }, short: "Mức giá chung tăng theo thời gian làm giảm sức mua của tiền.", prerequisites: [money-functions], difficulty: 1, tags: [CPI, lạm phát] }
  - { id: "real-return", name: { vi: "Lợi suất thực", en: "Real return" }, short: "Lợi suất sau khi loại bỏ tác động của lạm phát (phương trình Fisher).", prerequisites: [inflation, compound-interest], difficulty: 2, tags: [Fisher, lợi suất thực] }
  - { id: "expected-value-variance", name: { vi: "Kỳ vọng và phương sai", en: "Expected value and variance" }, short: "Công cụ xác suất mô tả mức trung bình và độ phân tán của kết quả bất định.", difficulty: 2, tags: [xác suất, thống kê] }
  - { id: "risk-return", name: { vi: "Rủi ro và lợi suất", en: "Risk and return" }, short: "Đánh đổi giữa lợi suất kỳ vọng và độ biến động; đo bằng độ lệch chuẩn, Sharpe.", prerequisites: [expected-value-variance, compound-interest], difficulty: 2, tags: [rủi ro, volatility, Sharpe] }
  - { id: "double-entry-accounting", name: { vi: "Kế toán kép", en: "Double-entry accounting" }, short: "Mỗi nghiệp vụ ghi Nợ và Có bằng nhau, giữ phương trình Tài sản = Nợ phải trả + Vốn chủ.", prerequisites: [money-functions], difficulty: 2, tags: [sổ cái, ledger, debit, credit] }
  - { id: "financial-statements", name: { vi: "Báo cáo tài chính", en: "Financial statements" }, short: "Bảng cân đối kế toán, báo cáo kết quả kinh doanh và báo cáo lưu chuyển tiền tệ.", prerequisites: [double-entry-accounting], difficulty: 2, tags: [balance sheet, income statement, cash flow] }
  - { id: "cash-flow-dcf", name: { vi: "Định giá chiết khấu dòng tiền", en: "Discounted cash flow valuation" }, short: "Giá trị doanh nghiệp = giá trị hiện tại của dòng tiền tự do tương lai, chiết khấu bằng chi phí vốn.", prerequisites: [npv-irr, financial-statements], difficulty: 3, tags: [DCF, FCF, WACC] }
  - { id: "central-bank-policy", name: { vi: "Ngân hàng trung ương và chính sách tiền tệ", en: "Central banks and monetary policy" }, short: "Ngân hàng trung ương điều hành lãi suất chính sách và cung tiền nhằm ổn định giá cả.", prerequisites: [interest-rate, inflation], difficulty: 2, tags: [NHNN, Fed, chính sách tiền tệ] }
  - { id: "financial-ratio-analysis", name: { vi: "Phân tích báo cáo tài chính", en: "Financial statement analysis" }, short: "Tỉ số sinh lời, thanh khoản, đòn bẩy, hiệu quả; phân rã ROE; chất lượng lợi nhuận so với dòng tiền.", prerequisites: [financial-statements], difficulty: 2, tags: [ROE, DuPont, tỉ số] }
  - { id: "revenue-recognition-accruals", name: { vi: "Ghi nhận doanh thu và kế toán dồn tích", en: "Revenue recognition and accrual accounting" }, short: "Doanh thu ghi khi nghĩa vụ được thực hiện, không khi nhận tiền; mô hình 5 bước, doanh thu chưa thực hiện, dồn tích.", prerequisites: [double-entry-accounting, financial-statements], difficulty: 3, tags: [IFRS 15, accrual] }
