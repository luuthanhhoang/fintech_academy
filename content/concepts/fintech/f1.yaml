track: fintech
stage: f1
concepts:
  - { id: "financial-markets-map", name: { vi: "Bản đồ thị trường tài chính", en: "Map of financial markets" }, short: "Thị trường tiền tệ và vốn; sơ cấp và thứ cấp; các chủ thể tham gia.", prerequisites: [money-functions, interest-rate], difficulty: 1, tags: [thị trường, primary, secondary] }
  - { id: "equities", name: { vi: "Cổ phiếu", en: "Equities" }, short: "Quyền sở hữu một phần doanh nghiệp; lợi suất từ cổ tức và chênh lệch giá.", prerequisites: [financial-markets-map, financial-statements], difficulty: 2, tags: [cổ phiếu, stock, dividend] }
  - { id: "bond-pricing", name: { vi: "Định giá trái phiếu", en: "Bond pricing" }, short: "Giá trái phiếu là giá trị hiện tại của coupon và mệnh giá, chiết khấu theo lợi suất.", prerequisites: [time-value-of-money, financial-markets-map], difficulty: 3, tags: [trái phiếu, coupon, YTM] }
  - { id: "yield-duration", name: { vi: "Lợi suất và duration", en: "Yield and duration" }, short: "Duration đo độ nhạy của giá trái phiếu với thay đổi lợi suất; convexity hiệu chỉnh bậc hai.", prerequisites: [bond-pricing], difficulty: 3, tags: [duration, convexity, rủi ro lãi suất] }
  - { id: "order-book", name: { vi: "Sổ lệnh", en: "Order book" }, short: "Danh sách lệnh mua/bán chờ khớp sắp theo giá; bid, ask và độ sâu thị trường.", prerequisites: [financial-markets-map], difficulty: 2, tags: [order book, bid, ask, lệnh giới hạn] }
  - { id: "matching-engine", name: { vi: "Bộ máy khớp lệnh", en: "Matching engine" }, short: "Thuật toán khớp lệnh theo ưu tiên giá rồi thời gian; lệnh thị trường, lệnh giới hạn, khớp một phần.", prerequisites: [order-book], difficulty: 3, tags: [matching, price-time priority] }
  - { id: "liquidity-spread", name: { vi: "Thanh khoản và chênh lệch giá", en: "Liquidity and spread" }, short: "Thanh khoản là khả năng giao dịch nhanh với chi phí thấp; spread và trượt giá đo chi phí này.", prerequisites: [order-book], difficulty: 2, tags: [thanh khoản, spread, slippage] }
  - { id: "clearing-settlement", name: { vi: "Bù trừ và thanh toán", en: "Clearing and settlement" }, short: "Sau khớp lệnh: xác nhận, bù trừ nghĩa vụ, chuyển giao chứng khoán và tiền (DvP).", prerequisites: [matching-engine], difficulty: 3, tags: [clearing, settlement, CCP, DvP] }
  - { id: "derivatives-basics", name: { vi: "Phái sinh cơ bản", en: "Derivatives basics" }, short: "Hợp đồng có giá trị phụ thuộc tài sản cơ sở: kỳ hạn, tương lai, quyền chọn, hoán đổi.", prerequisites: [financial-markets-map], difficulty: 2, tags: [phái sinh, futures, forward] }
  - { id: "leverage", name: { vi: "Đòn bẩy", en: "Leverage" }, short: "Dùng vốn vay hoặc phái sinh để khuếch đại lãi và lỗ so với vốn tự có.", prerequisites: [risk-return], difficulty: 2, tags: [đòn bẩy, margin] }
  - { id: "options-payoff", name: { vi: "Payoff quyền chọn", en: "Option payoffs" }, short: "Quyền chọn mua/bán: payoff tại đáo hạn, phí quyền chọn, các chiến lược kết hợp.", prerequisites: [derivatives-basics], difficulty: 3, tags: [call, put, payoff] }
  - { id: "diversification", name: { vi: "Đa dạng hoá", en: "Diversification" }, short: "Kết hợp tài sản tương quan thấp làm giảm rủi ro danh mục mà không nhất thiết giảm lợi suất kỳ vọng.", prerequisites: [risk-return], difficulty: 3, tags: [tương quan, covariance, danh mục] }
  - { id: "efficient-frontier", name: { vi: "Đường biên hiệu quả", en: "Efficient frontier" }, short: "Tập danh mục có lợi suất kỳ vọng cao nhất cho mỗi mức rủi ro (Markowitz).", prerequisites: [diversification], difficulty: 4, tags: [Markowitz, frontier] }
  - { id: "vn-securities-market", name: { vi: "Thị trường chứng khoán Việt Nam", en: "Vietnam securities market" }, short: "Cấu trúc sàn, cơ quan quản lý và hạ tầng bù trừ–thanh toán tại Việt Nam.", prerequisites: [financial-markets-map, clearing-settlement], difficulty: 2, tags: [HOSE, HNX, UBCKNN, VSDC] }
  - { id: "insurance-basics", name: { vi: "Bảo hiểm cơ bản", en: "Insurance basics" }, short: "Gộp rủi ro, phí bảo hiểm, dự phòng bồi thường, tỉ lệ tổn thất và tỉ lệ kết hợp.", prerequisites: [expected-value-variance, risk-return], difficulty: 2, tags: [bảo hiểm, insurtech] }
