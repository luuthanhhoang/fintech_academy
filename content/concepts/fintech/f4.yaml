  - { id: "ledger-design", name: { vi: "Thiết kế sổ cái", en: "Ledger design" }, short: "Sổ cái bất biến, bút toán kép, số dư suy ra từ bút toán, tài khoản và kỳ.", prerequisites: [double-entry-accounting, money-representation], difficulty: 3, tags: [ledger, immutable] }
  - { id: "idempotency", name: { vi: "Idempotency trong thanh toán", en: "Idempotency in payments" }, short: "Khoá idempotency để thử lại an toàn mà không trừ tiền hai lần.", prerequisites: [ledger-design, payment-systems], difficulty: 3, tags: [idempotency key, retry] }
  - { id: "reconciliation", name: { vi: "Đối soát", en: "Reconciliation" }, short: "So khớp sổ nội bộ với sao kê bên ngoài, phát hiện và xử lý chênh lệch.", prerequisites: [ledger-design], difficulty: 3, tags: [đối soát, recon] }
  - { id: "event-sourcing-audit", name: { vi: "Event sourcing và audit trail", en: "Event sourcing and audit trail" }, short: "Lưu chuỗi sự kiện bất biến để tái dựng trạng thái và phục vụ kiểm toán.", prerequisites: [ledger-design], difficulty: 3, tags: [event sourcing, audit] }
