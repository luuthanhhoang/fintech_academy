  - { id: "deployment-safety-finance", name: { vi: "Triển khai an toàn trong hệ thống tài chính", en: "Safe deployment in financial systems" }, short: "Feature flag, triển khai từng phần, kiểm tra cấu hình và quy trình rollback.", prerequisites: [operational-risk], difficulty: 3, tags: [deployment, rollback] }
