  - { id: "xss-csrf-cors", name: { vi: "XSS, CSRF và CORS", en: "XSS, CSRF and CORS" }, short: "Chèn script vào trang, lợi dụng cookie để gửi request giả, và chính sách cho phép đọc chéo origin.", prerequisites: [web-security-owasp, sessions-cookies], difficulty: 3, tags: [XSS, CSRF, CORS, CSP] }
  - { id: "injection-access-control", name: { vi: "Injection và kiểm soát truy cập", en: "Injection and access control" }, short: "Truy vấn tham số hoá chống injection; kiểm quyền trên server cho từng đối tượng (chống IDOR/BOLA).", prerequisites: [web-security-owasp, sql-queries-joins], difficulty: 3, tags: [SQL injection, IDOR, BOLA, authorization] }
