exercises:
  - id: ex-w2r-format
    conceptId: realtime-websocket-sse
    prompt: "Viết ba sự kiện SSE theo định dạng text/event-stream cho cập nhật trạng thái đơn (có id, tên sự kiện, dữ liệu JSON), và mô tả server xử lý request nối lại có header Last-Event-ID: 41."
    hint: "Mỗi trường một dòng 'id:', 'event:', 'data:'; kết thúc bằng dòng trống."
    solution: "Mỗi sự kiện gồm các dòng `id: 42`, `event: order-status`, `data: ` theo sau là JSON trạng thái đơn, rồi một dòng trống; tương tự cho id 43, 44. Khi nhận Last-Event-ID 41: tra bộ đệm sự kiện của kênh người dùng; nếu còn id 42 trở đi thì gửi lại 42, 43, 44 theo thứ tự rồi tiếp tục luồng; nếu 41 đã ra khỏi bộ đệm thì gửi một sự kiện yêu cầu client đồng bộ lại (client gọi API lấy trạng thái hiện tại)."
  - id: ex-w2r-scale
    conceptId: realtime-websocket-sse
    prompt: "50.000 người xem bảng giá, mỗi máy chịu được khoảng 10.000 kết nối (giả định đo được). Thiết kế kiến trúc và kế hoạch triển khai phiên bản mới không gây sập."
    hint: "Số máy, pub/sub, làn sóng nối lại."
    solution: "Tối thiểu 5 máy, chạy dư (ví dụ 7–8) để chịu lỗi và làn sóng nối lại. Nguồn giá phát vào pub/sub; mỗi máy đăng ký và đẩy tới kết nối của mình, gộp cập nhật theo mã. Triển khai: rút từng máy ra khỏi cân bằng tải, đóng kết nối từ từ (không đóng hết cùng lúc), client nối lại với độ trễ ngẫu nhiên và lấy ảnh chụp giá hiện tại rồi nghe tiếp; theo dõi số kết nối mỗi máy và tỉ lệ nối lại."
