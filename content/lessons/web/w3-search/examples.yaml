examples:
  - id: we-idf
    title: "IDF: từ hiếm nặng ký hơn"
    conceptId: full-text-search
    problem: "Kho N = 10.000 tài liệu. Tính idf(t) = ln((N − n + 0,5)/(n + 0,5) + 1) cho từ xuất hiện trong n = 6.000 tài liệu và từ xuất hiện trong n = 20 tài liệu."
    steps:
      - text: "n = 6.000: (10.000 − 6.000 + 0,5)/(6.000 + 0,5) + 1 ≈ 0,6667 + 1 = 1,6667; ln ≈ 0,511."
        faded: true
        prompt: "idf của từ phổ biến (3 chữ số thập phân)?"
        answer: 0.511
        tolerance: { kind: abs, value: 0.001 }
      - text: "n = 20: (10.000 − 20 + 0,5)/(20 + 0,5) + 1 ≈ 486,85 + 1 = 487,85; ln ≈ 6,190."
        faded: true
        prompt: "idf của từ hiếm (3 chữ số thập phân)?"
        answer: 6.19
        tolerance: { kind: abs, value: 0.001 }
      - text: "Một lần khớp từ hiếm đóng góp gấp khoảng 12 lần từ phổ biến — vì nó phân biệt tài liệu tốt hơn nhiều."
    takeaway: "IDF giải thích vì sao mã sản phẩm, tên riêng trong truy vấn quyết định thứ hạng mạnh hơn các từ chung."
