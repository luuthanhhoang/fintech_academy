exercises:
  - id: ex-f0r-upgrade
    conceptId: revenue-recognition-accruals
    prompt: "Khách mua gói 12 tháng 1.200.000 đ ngày 1/1; ngày 1/4 nâng cấp lên gói cao hơn, trả thêm 900.000 đ cho 9 tháng còn lại. Viết các bút toán và doanh thu ghi nhận mỗi tháng từ tháng 4."
    hint: "Phần cũ còn 900.000 đ chưa thực hiện; thêm 900.000 đ mới; 9 tháng còn lại."
    solution: "1/1: Nợ Tiền 1.200.000 / Có Doanh thu chưa thực hiện 1.200.000. Tháng 1–3: mỗi tháng Nợ DTCTH 100.000 / Có Doanh thu 100.000. 1/4: Nợ Tiền 900.000 / Có DTCTH 900.000 (số dư DTCTH = 900.000 + 900.000 = 1.800.000). Tháng 4–12: mỗi tháng ghi 1.800.000 / 9 = 200.000. Kiểm tra: 3 × 100.000 + 9 × 200.000 = 2.100.000 = tổng tiền thu."
  - id: ex-f0r-alloc
    conceptId: revenue-recognition-accruals
    prompt: "Gói 10.000.000 đ gồm máy POS (giá bán riêng lẻ 4.000.000) và 24 tháng phần mềm (giá bán riêng lẻ 8.000.000). Phân bổ giá và lập lịch ghi nhận tháng đầu."
    hint: "Tỉ lệ 4 : 8."
    solution: "Tổng giá bán riêng lẻ 12.000.000. Máy: 10.000.000 × 4/12 = 3.333.333 đ; phần mềm: 6.666.667 đ (phân bổ phần dư 1 đồng để tổng đúng 10.000.000). Tháng giao máy: ghi doanh thu máy 3.333.333 + phần mềm 6.666.667 / 24 ≈ 277.778 (phân bổ phần dư làm tròn qua các tháng sao cho tổng 24 tháng đúng 6.666.667)."
