exercises:
  - id: ex-f2b-tbook
    conceptId: money-creation
    prompt: "Viết các bút toán (tài sản/nợ của ngân hàng A và B) khi: (1) A cho khách X vay 200 triệu vào tài khoản tại A; (2) X chuyển 200 triệu trả cho Y có tài khoản tại B; (3) X trả hết nợ sau một năm (bỏ qua lãi)."
    hint: "Chuyển liên ngân hàng di chuyển dự trữ giữa A và B."
    solution: "(1) A: cho vay +200, tiền gửi X +200. (2) A: tiền gửi X −200, dự trữ −200; B: dự trữ +200, tiền gửi Y +200 — tiền gửi chuyển sang B, kèm dự trữ. (3) Giả sử X đã có lại 200 tại A: A: tiền gửi X −200, cho vay −200 — tiền gửi bị huỷ khi khoản vay được trả. Bước (2) cho thấy vì sao ngân hàng cho vay cần dự trữ/thanh khoản."
  - id: ex-f2b-nim
    conceptId: bank-balance-sheet
    prompt: "Ngân hàng giả định: tài sản sinh lãi bình quân 800 tỉ, thu lãi 64 tỉ, chi trả lãi 36 tỉ, phí thuần 6 tỉ, chi phí hoạt động 14 tỉ, dự phòng rủi ro 8 tỉ. Tính NIM và lợi nhuận trước thuế. Nếu dự phòng tăng gấp ba thì sao?"
    hint: "NIM = thu nhập lãi thuần / tài sản sinh lãi bình quân."
    solution: "Thu nhập lãi thuần = 28 tỉ; NIM = 28/800 = 3,5%. Lợi nhuận trước thuế = 28 + 6 − 14 − 8 = 12 tỉ. Dự phòng 24 tỉ: 28 + 6 − 14 − 24 = −4 tỉ, lỗ. Chất lượng tín dụng quyết định lợi nhuận nhiều không kém biên lãi."
