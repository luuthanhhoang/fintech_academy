examples:
  - id: we-fraud-pr
    title: "Accuracy, precision và recall trên dữ liệu mất cân bằng"
    conceptId: fraud-detection-ml
    problem: "Dữ liệu tổng hợp (mô phỏng): 50.000 giao dịch, 100 gian lận. Mô hình gắn cờ 400 giao dịch, trong đó 80 là gian lận thật."
    steps:
      - text: "Đúng = (không gắn cờ và không gian lận) + (gắn cờ và gian lận) = (50.000 − 400 − 20) + 80 = 49.660."
      - text: "Accuracy = 49.660 / 50.000 = 99,32% — thấp hơn mô hình 'luôn nói không' (99,8%)."
        faded: true
        prompt: "Accuracy bằng bao nhiêu %? (2 chữ số thập phân)"
        answer: 99.32
        tolerance: { kind: abs, value: 0.01 }
        unit: "%"
      - text: "Precision = 80 / 400 = 20%."
        faded: true
        prompt: "Precision bằng bao nhiêu %?"
        answer: 20
        tolerance: { kind: abs, value: 0.01 }
        unit: "%"
      - text: "Recall = 80 / 100 = 80% — mô hình bắt được 4/5 vụ gian lận, đổi lại cứ 5 cảnh báo có 4 báo nhầm."
        faded: true
        prompt: "Recall bằng bao nhiêu %?"
        answer: 80
        tolerance: { kind: abs, value: 0.01 }
        unit: "%"
    takeaway: "Mô hình hữu ích có thể có accuracy thấp hơn mô hình vô dụng; đánh giá bằng precision/recall và chi phí."
