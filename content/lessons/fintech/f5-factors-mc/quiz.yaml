items:
  - id: q-f5f-beta
    type: numeric
    conceptId: factor-models
    prompt: "Quỹ có β = 1,3. Lãi suất phi rủi ro 3%, thị trường lãi 13%. Quỹ lãi 17%. Alpha (mô hình một nhân tố) là bao nhiêu điểm phần trăm?"
    answer: 1
    tolerance: { kind: abs, value: 0.01 }
    unit: "điểm %"
    explanation: "Kỳ vọng do beta = 3 + 1,3 × (13 − 3) = 16%; alpha = 17 − 16 = 1 điểm %."
  - id: q-f5f-ff
    type: mcq
    conceptId: factor-models
    prompt: "Ba nhân tố cổ phiếu trong mô hình Fama–French (1993) là gì?"
    options:
      - { id: a, text: "Thị trường, quy mô công ty, tỉ số giá trị sổ sách trên giá thị trường" }
      - { id: b, text: "Lãi suất, lạm phát, tỉ giá" }
      - { id: c, text: "Động lượng, thanh khoản, cổ tức" }
    correct: [a]
    explanation: "Bài báo còn có hai nhân tố kỳ hạn cho trái phiếu; ba nhân tố cổ phiếu là thị trường, quy mô, giá trị."
  - id: q-f5f-mc-error
    type: numeric
    conceptId: monte-carlo
    prompt: "Mô phỏng 10.000 kịch bản cho sai số chuẩn 0,4%. Cần bao nhiêu kịch bản để sai số chuẩn còn 0,1%?"
    answer: 160000
    tolerance: { kind: abs, value: 0 }
    unit: "kịch bản"
    explanation: "Sai số ∝ 1/√N: giảm 4 lần cần N tăng 16 lần → 160.000."
