examples:
  - id: we-insurance-premium
    title: "Từ tần suất và mức độ tới phí bảo hiểm (giả định)"
    conceptId: insurance-basics
    problem: "Dữ liệu tổng hợp (mô phỏng): bảo hiểm màn hình, tần suất bồi thường 8%/năm, mức bồi thường trung bình 1.500.000 đ. Chi phí phân phối và vận hành chiếm 30% phí, biên mục tiêu 5% phí. Tính phí thuần và phí bán."
    steps:
      - text: "Phí thuần = 0,08 × 1.500.000 = 120.000 đ."
        faded: true
        prompt: "Phí thuần là bao nhiêu đồng?"
        answer: 120000
        tolerance: { kind: abs, value: 0 }
        unit: "đ"
      - text: "Phí bán × (1 − 0,30 − 0,05) = 120.000 → phí bán = 120.000 / 0,65 ≈ 184.615 đ."
        faded: true
        prompt: "Phí bán là bao nhiêu đồng? (làm tròn đến đồng)"
        answer: 184615
        tolerance: { kind: abs, value: 1 }
        unit: "đ"
      - text: "Nếu tần suất thật là 12% thay vì 8%, tổn thất kỳ vọng 180.000 đ — gần bằng cả phí bán, sản phẩm lỗ sau chi phí."
    takeaway: "Phí nhạy với ước lượng tần suất; sai vài điểm phần trăm có thể biến lãi thành lỗ."
