# Các góc ngắm. eye/look tính tương đối so với anchor (với "train": trục x là bên phải hướng tàu chạy, z là hướng tàu chạy).
defaultView: toan-canh
views:
  - id: toan-canh
    title: "Toàn cảnh"
    description: "Bay quanh làng, bấm vào ga, nhà, công trình để mở bài học và mô phỏng."
    mode: explore
    anchor: { kind: overview }
    eye: [380, 330, 520]
    look: [0, 0, 0]
  - id: tren-tau
    title: "Ngồi trong toa tàu"
    description: "Tàu chạy theo thời gian tập trung; ngoài cửa sổ là ruộng, sông, biển."
    mode: focus
    anchor: { kind: train }
    eye: [-0.5, 2.7, 0]
    look: [14, 4.2, 3]
    ambience: [train]
  - id: hien-nha
    title: "Hiên nhà nghe mưa"
    description: "Ngồi dưới mái hiên nhìn mưa rơi trên ruộng — cho phiên học sâu."
    mode: focus
    anchor: { kind: feature, id: hien-nha-mua }
    eye: [0, 2.0, 8.4]
    look: [12, 1.2, 34]
    weather: mua-nhe
  - id: cau-ca
    title: "Câu cá bên ao"
    description: "Mỗi con cá là một thẻ ôn đến hạn. Trả lời đúng để kéo cá lên."
    mode: review
    anchor: { kind: lake, id: ao-ky-uc }
    eye: [-22, 7, -18]
    look: [0, 0, 0]
    ambience: [birds, stream]
  - id: dinh-nui
    title: "Trên đỉnh núi"
    description: "Nhìn xuống cả lộ trình AI giữa tuyết và mây."
    mode: focus
    anchor: { kind: peak, id: dinh-transformer }
    eye: [40, 14, 55]
    look: [140, -60, 220]
    weather: tuyet
  - id: hai-dang-dem
    title: "Hải đăng ngắm sao"
    description: "Ngồi bên ngọn hải đăng, trăng sao và sóng biển — phiên học đêm."
    mode: focus
    anchor: { kind: feature, id: hai-dang }
    eye: [-20, 7, -14]
    look: [40, 5, 90]
    time: night
    ambience: [waves]
  - id: cho-phien-gan
    title: "Dạo chợ phiên"
    description: "Đứng giữa chợ: người mua bán chính là các lệnh trong sổ."
    mode: explore
    anchor: { kind: landmark, id: cho-phien }
    eye: [16, 7, 18]
    look: [0, 2, 0]
    ambience: [birds]
