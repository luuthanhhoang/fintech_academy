# Mỗi simulator / code lab / case / tình huống có đúng một công trình trong làng.
# Vị trí sinh tự động: cạnh ga của chặng có bài đầu tiên dùng tới nó. `model` phải có trong WORLD_MODEL_KEYS.
landmarks:
  - id: ngan-hang-lang
    model: bank
    ref: { kind: simulator, id: tvm }
    title: "Ngân hàng làng"
    metaphor: "Gửi thóc hôm nay, mùa sau nhận thêm — lãi nhập gốc như lúa giống nảy thêm lúa giống."
  - id: kho-thoc
    model: granary
    ref: { kind: simulator, id: inflation }
    title: "Kho thóc"
    metaphor: "Cùng một túi tiền, năm sau đổi được ít thóc hơn: lạm phát là kho thóc vơi dần sức mua."
  - id: dinh-lang
    model: communal-house
    ref: { kind: simulator, id: bond }
    title: "Đình làng — nơi vay để làm đường"
    metaphor: "Làng vay dân để làm đường, hẹn trả lãi đều; lãi suất ngoài chợ tăng thì tờ giấy nợ cũ mất giá."
  - id: cho-phien
    model: market
    ref: { kind: simulator, id: orderbook }
    title: "Chợ phiên"
    metaphor: "Người bán hét giá cao, người mua trả giá thấp; khoảng giữa là chênh lệch mua–bán, hàng người xếp là sổ lệnh."
  - id: choi-canh
    model: watchtower
    ref: { kind: simulator, id: options }
    title: "Chòi canh mùa vụ"
    metaphor: "Trả một khoản nhỏ trước để được quyền bán lúa giá đã định nếu mất mùa — quyền chọn như bảo hiểm."
  - id: vuon-da-canh
    model: orchard
    ref: { kind: simulator, id: portfolio }
    title: "Vườn đa canh"
    metaphor: "Trồng nhiều loại cây không cùng gặp hạn: đa dạng hoá giảm rủi ro khi tương quan thấp."
  - id: coi-xay-nuoc
    model: watermill
    ref: { kind: simulator, id: dcf }
    title: "Cối xay nước"
    metaphor: "Dòng nước của những năm sau quay bánh xe hôm nay — DCF quy dòng tiền tương lai về giá trị hiện tại."
  - id: nha-luu-so
    model: archive
    ref: { kind: lab, id: ledger-double-entry }
    title: "Nhà lưu sổ"
    metaphor: "Mỗi bao thóc ra khỏi kho phải có một dòng vào sổ ở nơi khác: bút toán kép luôn cân."
  - id: xuong-khop-lenh
    model: workshop
    ref: { kind: lab, id: matching-engine }
    title: "Xưởng khớp lệnh"
    metaphor: "Xưởng mộc lắp từng bánh răng của chợ phiên: tự viết bộ máy khớp lệnh để hiểu chợ chạy thế nào."
  - id: xuong-danh-muc
    model: workshop
    ref: { kind: lab, id: portfolio-math }
    title: "Xưởng tính danh mục"
    metaphor: "Bàn tính của vườn đa canh: tự tính phương sai danh mục bằng ma trận."
  - id: di-tich-knight
    model: ruin
    ref: { kind: case, id: knight-capital-2012 }
    title: "Di tích Knight Capital"
    metaphor: "Tàn tích nhắc rằng một cờ cấu hình cũ có thể đốt sạch vốn trong một buổi sáng."
  - id: di-tich-ltcm
    model: ruin
    ref: { kind: case, id: ltcm-1998 }
    title: "Di tích LTCM"
    metaphor: "Ngôi tháp xây quá cao trên nền vay mượn: đòn bẩy khuếch đại cả lúc thắng lẫn lúc thua."
  - id: di-tich-svb
    model: ruin
    ref: { kind: case, id: svb-2023 }
    title: "Di tích SVB"
    metaphor: "Ngân hàng cầm trái phiếu dài hạn khi lãi suất tăng nhanh, rồi người gửi rút tiền cùng lúc."
  - id: tram-tin-hieu-oncall
    model: signal-tower
    ref: { kind: scenario, id: oncall-order-spike }
    title: "Trạm tín hiệu on-call"
    metaphor: "Nơi diễn tập trực sự cố: tình huống giả định diễn ra giữa cơn giông."
  - id: tram-tin-hieu-alm
    model: signal-tower
    ref: { kind: scenario, id: alm-rate-shock }
    title: "Trạm tín hiệu ALM"
    metaphor: "Diễn tập quyết định của ban ALM trước cú sốc lãi suất (tình huống giả định)."
  - id: tram-tin-hieu-dcf
    model: signal-tower
    ref: { kind: scenario, id: dcf-review }
    title: "Trạm tín hiệu thẩm định"
    metaphor: "Diễn tập review một mô hình DCF quá đẹp (tình huống giả định)."
  - id: tram-tin-hieu-agent
    model: signal-tower
    ref: { kind: scenario, id: agent-injection }
    title: "Trạm tín hiệu harness"
    metaphor: "Diễn tập agent đọc email chứa prompt injection — hàng rào nào chặn được (tình huống giả định)."
guides:
  - id: cu-lai
    name: "Cụ Lãi"
    role: "Thủ quỹ ngân hàng làng"
    landmark: ngan-hang-lang
    tutorMode: socratic
    greeting: "Cháu muốn hiểu lãi kép thật sự? Ta hỏi, cháu nghĩ — đừng vội tra đáp án."
  - id: chi-khop
    name: "Chị Khớp"
    role: "Người giữ sổ chợ phiên"
    landmark: cho-phien
    tutorMode: practice
    greeting: "Muốn luyện vài câu về sổ lệnh và khớp lệnh không? Chị ra đề, em giải."
  - id: ky-su-rao
    name: "Kỹ sư Rào"
    role: "Người gác trạm harness"
    landmark: tram-tin-hieu-agent
    tutorMode: qa
    greeting: "Hỏi tôi về agent, công cụ và các lớp phòng thủ — tôi trả lời có trích nguồn từ bài học."
