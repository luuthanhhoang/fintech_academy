id: web
order: 2
title: { vi: "Fullstack web developer", en: "Fullstack web developer" }
summary: Từ một request HTTP đi qua mạng tới trình duyệt, frontend, API, cơ sở dữ liệu, xác thực và bảo mật, hiệu năng, kiểm thử đến triển khai và vận hành.
stages:
  - { id: "w0", order: 0, title: { vi: "Nền tảng web", en: "Web foundations" }, summary: "Vòng đời một request, ngữ nghĩa HTTP, cache, trình duyệt vẽ trang và Core Web Vitals." }
  - { id: "w1", order: 1, title: { vi: "Frontend hiện đại", en: "Modern frontend" }, summary: "HTML ngữ nghĩa và a11y, CSS layout, JavaScript bất đồng bộ, TypeScript, component/state và chiến lược render." }
  - { id: "w2", order: 2, title: { vi: "Backend & API", en: "Backend & APIs" }, summary: "Thiết kế REST, lỗi và validate, phân trang, idempotency và retry, GraphQL/gRPC, webhook." }
  - { id: "w3", order: 3, title: { vi: "Dữ liệu", en: "Data" }, summary: "Mô hình quan hệ, SQL và join, index, transaction và isolation, migration, N+1." }
  - { id: "w4", order: 4, title: { vi: "Xác thực & bảo mật", en: "Auth & security" }, summary: "Lưu mật khẩu, session/cookie, JWT, OAuth 2.0/OIDC, OWASP Top 10: XSS, CSRF, injection, phân quyền." }
  - { id: "w5", order: 5, title: { vi: "Hiệu năng & mở rộng", en: "Performance & scaling" }, summary: "Latency percentile, lý thuyết hàng đợi, rate limiting, cache/CDN, hàng đợi thông điệp, mở rộng ngang." }
  - { id: "w6", order: 6, title: { vi: "Kiểm thử & chất lượng", en: "Testing & quality" }, summary: "Kim tự tháp kiểm thử, unit/integration/contract/E2E và pipeline CI." }
  - { id: "w7", order: 7, title: { vi: "Triển khai & vận hành", en: "Delivery & operations" }, summary: "Container, CI/CD và chiến lược deploy, observability, SLO/error budget, ứng phó sự cố." }
