  - id: mcp-spec
    title: Model Context Protocol — Specification
    url: https://modelcontextprotocol.io/specification
    publisher: Model Context Protocol project
    accessed: 2026-11-05
    note: Ba primitive phía server (tools, resources, prompts) trên JSON-RPC 2.0 — kiểm tra qua bản sao tài liệu và tóm tắt trong kết quả tìm kiếm; phiên bản spec thay đổi theo thời gian.
  - id: agent-skills-spec
    title: Agent Skills — open format (SKILL.md, progressive disclosure)
    url: https://agentskills.io/
