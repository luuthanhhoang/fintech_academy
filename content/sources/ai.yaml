    title: "Reciprocal rank fusion outperforms Condorcet and individual rank learning methods — SIGIR 2009"
    url: https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf
    publisher: Cormack, Clarke & Büttcher / SIGIR
    accessed: 2026-11-06
  - id: goodfellow-dlbook
    title: "Deep Learning (bản đọc trực tuyến miễn phí)"
    url: https://www.deeplearningbook.org/
    publisher: Goodfellow, Bengio & Courville / MIT Press (2016)
    accessed: 2026-11-06
    note: Phần I (đại số tuyến tính, xác suất, tính toán số, cơ bản học máy) là nền cho các bài A0.
  - id: claude-messages-api
    title: Using the Messages API
    url: https://platform.claude.com/docs/en/build-with-claude/working-with-messages
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
    note: API không trạng thái (gửi lại toàn bộ lịch sử); temperature/top_p/top_k không còn hỗ trợ trên Claude 4.7+ và API version 2026-10-21; prefill không hỗ trợ trên Claude 4.6+.
  - id: claude-prompting-best-practices
    title: Prompting best practices
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
  - id: claude-streaming
    title: Streaming messages
    url: https://platform.claude.com/docs/en/build-with-claude/streaming
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
  - id: claude-batch-processing
    title: Batch processing (Message Batches API)
    url: https://platform.claude.com/docs/en/build-with-claude/batch-processing
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
  - id: claude-embeddings
    title: Embeddings
    url: https://platform.claude.com/docs/en/build-with-claude/embeddings
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
    note: Anthropic không có mô hình embedding riêng; trang giới thiệu một nhà cung cấp (Voyage AI) và khuyên đánh giá nhiều nhà cung cấp.
  - id: hnsw-2020
    title: "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs — IEEE TPAMI 42(4)"
    url: https://doi.org/10.1109/TPAMI.2018.2889473
    publisher: Malkov & Yashunin / IEEE
    accessed: 2026-11-06
  - id: claude-develop-tests
    title: Define success criteria and build evaluations
    url: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
    note: Nguyên tắc eval (sát việc thật, tự động hoá, ưu tiên số lượng) và so sánh chấm bằng code / người / LLM.
  - id: zheng-judge-2023
    title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena — NeurIPS 2023"
    url: https://neurips.cc/virtual/2023/poster/73434
    publisher: Zheng et al. / NeurIPS
    accessed: 2026-11-06
    note: Giám khảo LLM mạnh đạt mức đồng thuận với người trên 80% (ngang mức đồng thuận giữa người với người); nêu các thiên kiến như vị trí, độ dài.
