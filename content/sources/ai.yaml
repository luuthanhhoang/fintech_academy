sources:
  - id: anthropic-building-agents
    title: Building effective agents
    url: https://www.anthropic.com/research/building-effective-agents
    publisher: Anthropic
    accessed: 2026-11-05
    note: Bài 12/2024; trang hiện có ghi chú rằng hệ sinh thái công cụ đã thay đổi từ đó.
  - id: anthropic-context-engineering
    title: Effective context engineering for AI agents
    url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    publisher: Anthropic
    accessed: 2026-11-05
    note: Kiểm tra qua trích đoạn kết quả tìm kiếm (định nghĩa context engineering, "attention budget"). Các kỹ thuật cụ thể (compaction, ghi chú, sub-agent) đối chiếu qua bản tóm tắt thứ cấp.
  - id: anthropic-writing-tools
    title: Writing effective tools for agents — with agents
    url: https://www.anthropic.com/engineering/writing-tools-for-agents
    publisher: Anthropic
    accessed: 2026-11-05
  - id: react-2022
    title: "ReAct: Synergizing Reasoning and Acting in Language Models (Yao et al., ICLR 2023)"
    url: https://arxiv.org/abs/2210.03629
    publisher: arXiv
    accessed: 2026-11-05
  - id: swe-bench-2023
    title: "SWE-bench: Can Language Models Resolve Real-World GitHub Issues? (Jimenez et al., ICLR 2024)"
    url: https://arxiv.org/abs/2310.06770
    publisher: arXiv
    accessed: 2026-11-05
  - id: owasp-llm-top10
    title: OWASP Top 10 for Large Language Model Applications (2023, v0.9 PDF)
    url: https://owasp.org/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-2023-v09.pdf
    publisher: OWASP Foundation
    accessed: 2026-11-05
    note: Bản 2023; theo kết quả tìm kiếm, bản 2025 vẫn xếp prompt injection đứng đầu (chưa kiểm tra trực tiếp bản 2025).
  - id: mcp-spec
    title: Model Context Protocol — Specification
    url: https://modelcontextprotocol.io/specification
    publisher: Model Context Protocol project
    accessed: 2026-11-05
    note: Ba primitive phía server (tools, resources, prompts) trên JSON-RPC 2.0 — kiểm tra qua bản sao tài liệu và tóm tắt trong kết quả tìm kiếm; phiên bản spec thay đổi theo thời gian.
  - id: agent-skills-spec
    title: Agent Skills — open format (SKILL.md, progressive disclosure)
    url: https://agentskills.io/
    publisher: Agent Skills (khởi xướng bởi Anthropic)
    accessed: 2026-11-05
  - id: claude-agent-sdk-docs
    title: Agent SDK overview
    url: https://code.claude.com/docs/en/agent-sdk/overview
    publisher: Anthropic — Claude Code Docs
    accessed: 2026-11-05
    note: Tài liệu chính thức mô tả SDK cung cấp vòng lặp agent, công cụ, quản lý context (dùng trong Claude Code), subagent, permission, hook, MCP.
  - id: anthropic-agent-evals
    title: Demystifying evals for AI agents
    url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
    publisher: Anthropic
    accessed: 2026-11-05
    note: Bài 01/2026; chi tiết về các loại grader và việc đọc transcript đối chiếu qua bản tóm tắt thứ cấp.
  - id: rumelhart-1986
    title: "Learning representations by back-propagating errors — Nature 323, 533–536"
    url: https://doi.org/10.1038/323533a0
    publisher: Rumelhart, Hinton & Williams / Nature
    accessed: 2026-11-06
    note: Bài phổ biến thuật toán lan truyền ngược cho mạng có lớp ẩn; toán nền đã được khám phá độc lập trước đó.
  - id: vaswani-2017
    title: "Attention Is All You Need — NIPS 2017"
    url: https://research.google/pubs/attention-is-all-you-need/
    publisher: Vaswani et al. / Google Research
    accessed: 2026-11-06
    note: Kiến trúc Transformer chỉ dựa trên attention, bỏ hồi quy và tích chập; kết quả dịch máy WMT 2014.
  - id: sennrich-bpe-2016
    title: "Neural Machine Translation of Rare Words with Subword Units — ACL 2016"
    url: https://aclanthology.org/P16-1162/
    publisher: Sennrich, Haddow & Birch / ACL Anthology
    accessed: 2026-11-06
    note: Đưa byte pair encoding vào NMT để biểu diễn từ hiếm bằng chuỗi đơn vị dưới-từ.
  - id: ouyang-2022
    title: "Training language models to follow instructions with human feedback — NeurIPS 2022"
    url: https://neurips.cc/virtual/2022/poster/52886
    publisher: Ouyang et al. / NeurIPS
    accessed: 2026-11-06
    note: InstructGPT — fine-tune có giám sát trên minh hoạ của người, rồi RLHF trên xếp hạng đầu ra.
  - id: holtzman-2020
    title: "The Curious Case of Neural Text Degeneration — ICLR 2020"
    url: https://iclr.cc/virtual/2020/poster/1428
    publisher: Holtzman, Buys, Du, Forbes & Choi / ICLR
    accessed: 2026-11-06
    note: Đề xuất nucleus (top-p) sampling; lập luận cực đại hoá xác suất là mục tiêu giải mã kém cho sinh văn bản mở.
  - id: kalai-2025
    title: "Why Language Models Hallucinate"
    url: https://openai.com/index/why-language-models-hallucinate/
    publisher: Kalai, Nachum, Vempala & Zhang / OpenAI
    accessed: 2026-11-06
    note: Lập luận cách chấm điểm chỉ theo độ chính xác thưởng cho việc đoán thay vì thừa nhận không chắc; đây là lập luận của chính các tác giả.
  - id: liu-lost-middle-2024
    title: "Lost in the Middle: How Language Models Use Long Contexts — TACL 12"
    url: https://aclanthology.org/2024.tacl-1.9/
    publisher: Liu et al. / ACL Anthology
    accessed: 2026-11-06
    note: Hiệu năng giảm khi thông tin liên quan nằm giữa ngữ cảnh dài, kể cả với mô hình ngữ cảnh dài.
  - id: claude-context-windows
    title: Context windows
    url: https://platform.claude.com/docs/en/build-with-claude/context-windows
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
    note: Mọi thứ trong request (system, messages, tool, output kể cả thinking) đều tính vào cửa sổ; ngữ cảnh dài làm độ chính xác giảm ("context rot").
  - id: claude-tool-use
    title: Tool use with Claude
    url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
  - id: claude-structured-outputs
    title: Structured outputs
    url: https://platform.claude.com/docs/en/build-with-claude/structured-outputs
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
    note: Constrained decoding theo JSON schema (output_config.format) và strict tool use; có ngoại lệ khi từ chối hoặc chạm max_tokens.
  - id: claude-prompt-caching
    title: Prompt caching
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    publisher: Anthropic (Claude Platform docs)
    accessed: 2026-11-06
  - id: anthropic-contextual-retrieval
    title: Introducing Contextual Retrieval
    url: https://www.anthropic.com/news/contextual-retrieval
    publisher: Anthropic
    accessed: 2026-11-06
    note: Bài 19/9/2024; số liệu là trên bộ thử của chính Anthropic.
  - id: lewis-rag-2020
    title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks — NeurIPS 2020"
    url: https://papers.nips.cc/paper/2020/hash/6b493230205f780e1bc26945df7481e5-Abstract.html
    publisher: Lewis et al. / NeurIPS
    accessed: 2026-11-06
